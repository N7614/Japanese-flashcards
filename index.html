<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Từ Vựng Flashcard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <button id="btn-library" class="nav-btn active">Thư Viện</button>
        <button id="btn-learn" class="nav-btn">Học Từ Vựng</button>
        <button id="btn-list" class="nav-btn">Danh Sách</button>
    </header>

    <!-- Giao diện Thư Viện -->
    <main id="view-library" class="view active-view">
        <h2 style="text-align: center; color: #007bff;">Chọn Gói Từ Vựng</h2>
        <div class="tree-container" id="library-tree">
            <!-- Cây danh sách sẽ được tạo bằng Javascript -->
        </div>
        <div style="text-align: center; margin-top: 1.5rem;">
            <button id="btn-load" class="btn-load">Tải & Bắt Đầu Học</button>
        </div>
    </main>

    <!-- Giao diện Học -->
    <main id="view-learn" class="view">
        <div class="card-wrapper">
            <div class="card-container">
                <div class="card" id="flashcard">
                    <div class="card-front" id="card-front">Đang tải...</div>
                    <div class="card-back" id="card-back">Đang tải...</div>
                </div>
            </div>
        </div>
        <div class="controls">
            <button id="btn-forget" class="btn-danger">❮ Quên</button>
            <button id="btn-remember" class="btn-success">Nhớ ❯</button>
        </div>
        <p class="tip-text">💡 Nhấn thẻ để lật (hoặc Phím cách/Mũi tên lên-xuống). Vuốt trái (hoặc Mũi tên trái) = Quên, Vuốt phải (hoặc Mũi tên phải) = Nhớ. Phím <strong>S</strong> để nghe phát âm 🔊.</p>
        <div style="text-align: center; margin-top: 1rem; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
            <button id="btn-counter" class="btn-sub">Số thẻ đã học</button>
            <button id="btn-find-list" class="btn-sub">🔍 Tìm trong danh sách</button>
        </div>

        <!-- Bảng tùy chọn học từ vựng -->
        <div class="learn-settings-panel">
            <div class="settings-title">⚙️ Tùy chọn học từ vựng</div>
            <div class="settings-grid">
                <div class="setting-item">
                    <label for="select-word-count">Số lượng từ:</label>
                    <select id="select-word-count">
                        <option value="10">10 từ</option>
                        <option value="20">20 từ</option>
                        <option value="30">30 từ</option>
                        <option value="50">50 từ</option>
                        <option value="all" selected>Tất cả từ</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="select-order-mode">Thứ tự:</label>
                    <select id="select-order-mode">
                        <option value="random" selected>Ngẫu nhiên</option>
                        <option value="sequential">Theo thứ tự</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="select-display-mode">Chiều học (Mặt trước):</label>
                    <select id="select-display-mode">
                        <option value="ja-vi" selected>🇯🇵 Nhật ➔ 🇻🇳 Việt</option>
                        <option value="vi-ja">🇻🇳 Việt ➔ 🇯🇵 Nhật</option>
                        <option value="mixed">🔀 Ngẫu nhiên 2 chiều</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="select-filter-mode">Bộ lọc từ:</label>
                    <select id="select-filter-mode">
                        <option value="all" selected>Tất cả từ</option>
                        <option value="unlearned">Chưa thuộc (Điểm ≤ 0)</option>
                        <option value="low-score">Cần ôn (Điểm < 3)</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="select-furigana-mode">Cách đọc (Hiragana):</label>
                    <select id="select-furigana-mode">
                        <option value="always" selected>Bật (Hiện cùng Kanji)</option>
                        <option value="back-only">Chỉ hiện khi lật thẻ</option>
                        <option value="hide">Tắt (Chỉ hiển thị Kanji)</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="select-tts-mode">Phát âm (Giọng đọc):</label>
                    <select id="select-tts-mode">
                        <option value="manual" selected>Nhấn nút 🔊 hoặc phím 'S'</option>
                        <option value="auto">Tự động phát âm khi hiện từ</option>
                        <option value="off">Tắt âm thanh</option>
                    </select>
                </div>
            </div>

            <div class="settings-action">
                <button id="btn-refresh-session" class="btn-refresh">🔄 Làm mới phiên học</button>
                <span id="session-info-badge" class="session-badge"></span>
            </div>
        </div>
    </main> 

    <!-- Giao diện Danh sách -->
    <main id="view-list" class="view">
        <div class="list-controls">
            <button id="btn-sort" class="btn-sort">Sắp xếp: Thứ tự gốc</button>
            <label>Lọc:
                <select id="filter-select">
                    <option value="all">Tất cả</option>
                    <option value="positive">Điểm dương (> 0)</option>
                    <option value="negative">Điểm âm (< 0)</option>
                </select>
            </label>
            <button id="btn-reset" class="btn-reset">Đặt lại toàn bộ điểm</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 50px; text-align: center;">STT</th>
                        <th>Từ vựng</th>
                        <th>Nghĩa</th>
                        <th>Nguồn</th>
                        <th style="width: 80px; text-align: center;">Điểm</th>
                    </tr>
                </thead>
                <tbody id="vocab-tbody">
                </tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
